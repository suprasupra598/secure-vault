{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>My Credentials</h3>
    <a href="{{ url_for('main.add_entry') }}" class="btn btn-info">Add New</a>
</div>

<div class="row">
    {% for entry in entries %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3">
            <h5 class="text-info">{{ entry.website }}</h5>
            <p class="mb-1 text-muted">User: {{ entry.username_val }}</p>
            <div class="mt-2">
                <!-- Trigger Modal instead of direct reveal -->
                <button class="btn btn-sm btn-secondary" onclick="openAuthModal('{{ entry.id }}')">Show Password</button>
                <a href="{{ url_for('main.delete', id=entry.id) }}" class="btn btn-sm btn-outline-danger ms-2">Delete</a>
            </div>
            <p id="pw-{{ entry.id }}" class="mt-2 text-warning fw-bold" style="display:none; font-family: monospace;"></p>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Modal for Password Verification -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Confirm Master Password</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Please enter your Master Password to view this credential.</p>
                <input type="password" id="masterAuthPass" class="form-control mb-3" placeholder="Master Password">
                <div id="modalError" class="text-danger small" style="display:none;">Incorrect password!</div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-info" onclick="verifyAndShow()">Unlock</button>
            </div>
        </div>
    </div>
</div>

<!-- Include Bootstrap JS for Modals -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let currentEntryId = null;
const authModal = new bootstrap.Modal(document.getElementById('authModal'));

function openAuthModal(id) {
    currentEntryId = id;
    document.getElementById('masterAuthPass').value = '';
    document.getElementById('modalError').style.display = 'none';
    authModal.show();
}

function verifyAndShow() {
    const password = document.getElementById('masterAuthPass').value;
    const csrfToken = "{{ csrf_token() }}";

    fetch('/reveal/' + currentEntryId, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({ password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.password) {
            const el = document.getElementById('pw-' + currentEntryId);
            el.innerText = data.password;
            el.style.display = 'block';
            authModal.hide();
        } else {
            document.getElementById('modalError').style.display = 'block';
        }
    })
    .catch(err => {
        console.error(err);
        alert("An error occurred.");
    });
}
</script>
{% endblock %}
